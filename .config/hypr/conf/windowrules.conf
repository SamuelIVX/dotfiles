# Window and Workspace Rules
# See https://wiki.hypr.land/Configuring/Window-Rules/
# See https://wiki.hypr.land/Configuring/Workspace-Rules/

# Ignore maximize requests from applications
windowrule {
  name = windowrule-1
  suppress_event = on
  maximize = on
  match:class = .*
}

# Fix dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}
