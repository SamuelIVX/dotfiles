# Window and Workspace Rules
# See https://wiki.hypr.land/Configuring/Window-Rules/
# See https://wiki.hypr.land/Configuring/Workspace-Rules/

# 1. Ignore maximize requests from applications
windowrule {
  name = suppress-maximize-events
  suppress_event = maximize
  match:class = .*
}

# 2. Default floating for all applications (75% centered)
windowrule {
  name = default-floating
  float = on
  size = 75% 75%
  center = on
  match:class = .*
}

# 3. Dedicated Developer floating tools (lazygit, btop at 85%)
windowrule {
  name = floating-terminal
  float = on
  size = 85% 85%
  center = on
  match:class = ^(floating-terminal)$
}

# 4. Dialogs and modals (floating without forcing 75% geometry)
windowrule {
  name = dialogs-and-pickers
  float = on
  center = on
  match:title = ^(Open File|Save File|Choose Files|Select a File|Confirm|Authentication|File Upload|Open Folder|Save As).*$
}

# 5. Fix dragging issues with XWayland
windowrule {
  name = fix-xwayland-drags
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}
