# Autostart Necessary Daemons & Background Services
exec-once = nm-applet --indicator
exec-once = waybar & awww-daemon
exec-once = swaync
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/wallpaper.sh
exec-once = wl-paste --watch cliphist store
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
