# #######################################################################################
# HYPRLOCK CONFIGURATION (CATPPUCCIN MOCHA)
# #######################################################################################

bezier = linear, 1, 1, 0, 0
animation = fade, 1, 1.8, linear

# Dynamic blurred desktop background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock - Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%-I:%M')</span>"
    color = rgb(205, 214, 244) # Text
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 72
    position = 0, 160
    halign = center
    valign = center
}

# Clock - Date
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%A, %B %d')</span>"
    color = rgb(166, 173, 200) # Subtext0
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    position = 0, 90
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = Hi, Samuel
    color = rgb(203, 166, 247) # Mauve
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    position = 0, -20
    halign = center
    valign = center
}

# Input Field
input-field {
    monitor =
    size = 280, 48

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outline_thickness = 2

    # Catppuccin Mocha Colors
    inner_color = rgba(30, 30, 46, 0.75) # Base
    outer_color = rgba(203, 166, 247, 0.8) # Mauve
    check_color = rgba(249, 226, 175, 0.8) # Yellow
    fail_color = rgba(243, 139, 168, 0.8) # Red

    font_color = rgb(205, 214, 244) # Text
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    
    fade_on_empty = false
    rounding = 12

    position = 0, -80
    halign = center
    valign = center
}
